
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090b12">
  <title>Raka's iPhone</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --text: #fff;
      --muted: #c8c9d2;
      --glass: rgba(255, 255, 255, .17);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(ellipse at 20% 20%, #28365b 0, transparent 45%),
        radial-gradient(ellipse at 80% 80%, #493044 0, transparent 45%),
        #08090e;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Segoe UI", sans-serif;
    }

    button {
      font: inherit;
      color: inherit;
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    .phone {
      position: relative;
      isolation: isolate;
      width: min(390px, calc((100dvh - 40px) * 390 / 844));
      aspect-ratio: 390 / 844;
      max-height: calc(100dvh - 40px);
      overflow: hidden;
      flex-shrink: 0;
      border: 5px solid #303137;
      border-radius: 49px;
      background: #121626;
      box-shadow:
        0 0 0 1px #777880,
        0 0 0 3px #101115,
        0 24px 75px #000b,
        inset 0 0 0 1px #ffffff15;
    }

    .wallpaper {
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse at 15% 18%, #6175a9 0, transparent 35%),
        radial-gradient(ellipse at 80% 36%, #865779 0, transparent 37%),
        radial-gradient(ellipse at 50% 90%, #222f52 0, transparent 55%),
        linear-gradient(150deg, #111a31, #151323 55%, #080c18);
    }

    .wallpaper::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #0001, #0003 65%, #0006);
      pointer-events: none;
    }

    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      padding: 15px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 20;
      font-size: 12px;
      font-weight: 650;
    }

    .lock-screen ~ .status-bar {
      display: none;
    }
    
    .phone:has(#lockScreen.active) > .status-bar {
  display: none;
}

    .status-icons {
      display: flex;
      gap: 5px;
      align-items: center;
      font-size: 12px;
    }

    .dynamic-island {
      position: absolute;
      z-index: 25;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
      width: 108px;
      height: 30px;
      background: #000;
      border-radius: 20px;
      box-shadow: inset 0 0 0 1px #222;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: block;
      visibility: hidden;
      opacity: 0;
      transform: translateY(12px);
      overflow: hidden;
      transition:
        opacity 0.32s ease,
        transform 0.38s ease,
        visibility 0.38s ease;
      pointer-events: none;
    }

    .screen.active {
      visibility: visible;
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

      /* LOCK SCREEN */
    
    .lock-screen {
      position: absolute;
      inset: 0;
      text-align: center;
      padding-top: 95px;
      background: linear-gradient(180deg, #00000008, #00000010 60%, #0005);
      touch-action: none;
      user-select: none;
    }
    
    .lock-status-bar {
      position: absolute;
      top: 12px;
      left: 18px;
      right: 8px;
      height: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      color: white;
      z-index: 50;
    }
    
    .lock-carrier {
      display: none;
    }
    
    .lock-status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 9px;
      margin-left: auto;
      margin-right: 0;
    }
    
    .lock-battery {
      width: 19px;
      height: 9px;
      border: 1px solid currentColor;
      border-radius: 2px;
      padding: 1px;
      position: relative;
      margin-right: 3px;
    }
    
    .lock-battery::after {
      content: "";
      position: absolute;
      right: -3px;
      top: 2px;
      width: 2px;
      height: 4px;
      background: currentColor;
      border-radius: 0 1px 1px 0;
    }
    
    .lock-battery-level {
      display: block;
      width: 75%;
      height: 100%;
      background: currentColor;
      border-radius: 1px;
    }

    .lock-hint {
      font-size: 13px;
      color: #e0e1ec;
      margin-bottom: 12px;
    }

    .lock-date {
      font-size: 17px;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .lock-time {
      font-size: clamp(38px, 11vw, 50px);
      line-height: 1.1;
      font-weight: 300;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 3px 22px #0002;
    }

    .lock-message {
      position: absolute;
      left: 20px;
      right: 20px;
      bottom: 120px;
      padding: 13px 16px;
      border: 1px solid #ffffff18;
      border-radius: 19px;
      background: #d6d9e522;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      text-align: left;
      font-size: 12px;
      line-height: 1.5;
    }

    .lock-message strong {
      display: block;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .lock-bottom {
      position: absolute;
      bottom: 23px;
      left: 0;
      right: 0;
      padding: 0 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .round-control {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #22273599;
      border: 1px solid #ffffff2a;
      font-size: 19px;
    }

    .swipe-hint {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 105px;
      height: 4px;
      border-radius: 999px;
      background: #fff;
      z-index: 100;
      pointer-events: none;
    }

    /* PASSCODE */

    .passcode-screen {
      text-align: center;
      padding: 95px 22px 35px;
      background: #10111beF;
      backdrop-filter: blur(20px);
    }

    .passcode-screen h2 {
      font-size: 23px;
      font-weight: 600;
      margin: 17px 0 8px;
    }

    .passcode-screen p {
      font-size: 13px;
      color: #c7c8d3;
    }

    .passcode-dots {
      display: flex;
      justify-content: center;
      gap: 17px;
      margin: 28px 0 22px;
    }

    .passcode-dot {
      width: 11px;
      height: 11px;
      border: 1px solid #fff;
      border-radius: 50%;
    }

    .passcode-dot.filled {
      background: white;
    }

    .keypad {
      width: min(270px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px 20px;
    }

    .key {
      aspect-ratio: 1;
      max-height: 61px;
      border-radius: 50%;
      background: #ffffff20;
      font-size: 25px;
      font-weight: 400;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background .15s;
    }

    .key:active {
      background: #ffffff48;
    }

    .key small {
      font-size: 8px;
      letter-spacing: 2px;
      margin-top: 1px;
    }

    .key.action {
      background: transparent;
      font-size: 12px;
    }

    .passcode-error {
      min-height: 17px;
      color: #ff8d98 !important;
      margin-bottom: 7px;
    }

    /* HOME SCREEN */

    .home-screen {
      padding: 67px 17px 92px;
    }

    .welcome {
      margin: 9px 5px 21px;
      text-shadow: 0 2px 14px #0004;
    }

    .welcome .small-date {
      font-size: 13px;
      color: #e1e2ed;
      margin-bottom: 5px;
    }

    .welcome h1 {
      font-size: 27px;
      font-weight: 650;
      letter-spacing: -.7px;
    }

    .widget-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 25px;
    }

    .widget {
      min-height: 100px;
      border-radius: 21px;
      padding: 13px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(20, 24, 38, 0.48);
      backdrop-filter: blur(20px) saturnate(140px);
      -webkit-backdrop-filter: blur(20px) saturnate(140);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.98);
      overflow: hidden;
    }

    .widget-label {
      width: 100%;
      font-size: 11px;
      line-height: 14px;
      font-weight: 400;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
      text-shadow: 0 1px 3px rgb(0, 0, 0, 0.7);
      -webkit-user-select: none;
      user-select: none;
    }

    .widget-main {
      font-size: 24px;
      font-weight: 600;
    }

    .widget-sub {
      color: #d0d2df;
      font-size: 10px;
      margin-top: 4px;
    }

    .calendar-widget {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .calendar-number {
      font-size: 30px;
      font-weight: 600;
    }

    .calendar-month {
      font-size: 11px;
      color: #e0d6e9;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      column-gap: 7px;
      row-gap: 21px;
    }

    .app {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      background: transparent;
    }

    .app-icon {
      width: clamp(48px, 14vw, 57px);
      height: clamp(48px, 14vw, 57px);
      border-radius: 15px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      font-size: 26px;
      box-shadow:
        inset 0 1px 1px #ffffff55,
        inset 0 -1px 1px #0002,
        0 3px 8px #0003;
      transition: transform .15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .app:active .app-icon {
      transform: scale(.92);
      filter: brightness(.92);
    }

    .app-label {
      width: 100%;
      font-size: 10px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 4px #000b;
    }

    .dock {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      min-height: 82px;
      padding: 10px 9px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 8px;
      border: 1px solid #ffffff30;
      border-radius: 27px;
      background: rgba(220, 224, 240, 0.22);
      backdrop-filter: blur(30px) saturate(160%);
      -webkit-backdrop-filter: blur(30px) saturate(160%);
      z-index: 10;
    }

    .dock .app {
      flex: 1;
    }

    .dock .app-icon {
      width: clamp(44px, 12vw, 53px);
      height: clamp(44px, 12vw, 53px);
      border-radius: 14px;
    }

    .dock .app-label {
      display: none;
    }

    /* APP WINDOWS */

    .app-screen {
      background: #f5f5fa;
      color: #17171c;
    }

    .app-topbar {
      min-height: 94px;
      padding: 52px 19px 13px;
      background: rgba(248, 248, 252, .96);
      border-bottom: 1px solid #dddde5;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 10px;
    }

    .app-topbar h2 {
      font-size: 26px;
      letter-spacing: -.6px;
    }

    .back-button {
      color: #087df5;
      background: transparent;
      font-size: 14px;
      padding: 5px 0;
    }

    .app-content {
      padding: 19px;
      overflow-y: auto;
      max-height: calc(100% - 94px);
      overscroll-behavior: contain;
    }

    .app-card {
      background: white;
      border: 1px solid #e5e5ec;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .app-card h3 {
      font-size: 15px;
      margin-bottom: 6px;
    }

    .app-card p {
      color: #73737e;
      font-size: 13px;
      line-height: 1.5;
    }

    .note-input {
      width: 100%;
      min-height: 270px;
      border: 0;
      outline: none;
      resize: vertical;
      background: transparent;
      font: inherit;
      font-size: 16px;
      line-height: 1.6;
      color: #17171c;
    }

    .chat-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .chat-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #e5e5ec;
      background: transparent;
      color: #17171c;
      text-align: left;
      width: 100%;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      font-size: 18px;
      background: linear-gradient(135deg, #5e78b8, #ba7e9f);
      flex-shrink: 0;
    }

    .chat-details {
      flex: 1;
      min-width: 0;
    }

    .chat-details strong {
      font-size: 14px;
    }

    .chat-details p {
      margin-top: 4px;
      font-size: 12px;
      color: #777781;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .settings-row {
      padding: 14px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e7e7ee;
      font-size: 14px;
    }

    .wallpaper-options {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .wallpaper-choice {
      width: 57px;
      height: 76px;
      border: 2px solid transparent;
      border-radius: 12px;
      background: linear-gradient(150deg, #677cb3, #9c668f, #16172b);
    }

    .wallpaper-choice:nth-child(2) {
      background: linear-gradient(150deg, #e4b7a0, #b95b72, #362644);
    }

    .wallpaper-choice:nth-child(3) {
      background: linear-gradient(150deg, #5c998b, #203d54, #101621);
    }

    .call-screen {
      background: linear-gradient(180deg, #303b55, #121521 75%);
      color: white;
      text-align: center;
      padding-top: 145px;
    }

    .call-avatar {
      width: 100px;
      height: 100px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 42px;
      background: linear-gradient(135deg, #8d9ec8, #59485f);
    }

    .call-name {
      font-size: 27px;
      font-weight: 500;
    }

    .call-sub {
      margin-top: 8px;
      color: #d2d4df;
      font-size: 13px;
    }

    .call-actions {
      position: absolute;
      bottom: 65px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 52px;
    }

    .call-action {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 25px;
      background: #ffffff20;
    }

    .call-action.end {
      background: #ff453a;
    }

    .toast {
      position: absolute;
      left: 22px;
      right: 22px;
      top: 52px;
      z-index: 50;
      padding: 12px;
      text-align: center;
      border-radius: 13px;
      background: #252631ed;
      color: white;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-10px);
      transition: .2s;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 430px) {
      body {
        padding: 0;
        background: #090b12;
      }

      .phone {
        width: min(100vw, calc(100dvh * 390 / 844));
        max-height: 100dvh;
        border-width: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .dynamic-island {
        top: 9px;
      }

      .home-screen {
        padding-left: 15px;
        padding-right: 15px;
      }
    }

    @media (max-height: 1px) and (min-width: 431px) {
      body {
        padding: 10px;
      }

      .phone {
        width: min(320px, calc((100dvh - 20px) * 390 / 844));
        max-height: calc(100dvh - 20px);
      }

      .home-screen {
        padding-top: 60px;
        padding-bottom: 83px;
      }

      .welcome {
        margin-bottom: 13px;
      }

      .widget {
        min-height: 75px;
      }

      .widget-grid {
        margin-bottom: 17px;
      }

      .app-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        column-gap: 5px;
        row-gap: 18px;
        align-items: start;
        justify-items: stretch;
      }

      .dock {
        bottom: 9px;
        min-height: 67px;
      }
    }
    

/* WhatsApp iPhone-style layout */
    
.app-screen.wa-compact .app-content {
  box-sizing: border-box;
  flex: 1;
  min-height: 0;
  max-height: none;
  width: 100%;
  padding: 10px 14px 16px;
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
}

.app-screen.wa-compact .app-topbar h2 {
  font-size: 22px;
  letter-spacing: -0.4px;
  line-height: 1.2;
}

.app-screen.wa-compact #appContent {
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
}

.app-screen.wa-compact #waHomeContent {
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
}

.wa-bottom-nav {
  flex-shrink: 0;
  width: 100%;
  box-sizing: border-box;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 7px 2px calc(7px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid #e9edef;
  background: #fefefe;
}

.wa-bottom-nav button {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 3px 0;
  border: 0;
  background: transparent;
  color: #667781;
  font-size: 10px;
}

.wa-bottom-nav .wa-nav-icon {
  font-size: 20px;
  line-height: 22px;
}

.wa-bottom-nav button.active {
  color: #008f78;
  font-weight: 600;
}

.app-screen.wa-compact {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

    .app-screen.wa-compact #appContent.wa-chat-open {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.app-screen.wa-compact #appContent.wa-chat-open > div {
  flex: 1;
  min-height: 0;
}

.app-screen.wa-compact #appContent.wa-chat-open form {
  flex-shrink: 0;
}

    
/* Prevent text selection while dragging the phone screen */
#phone {
  user-select: none;
  -webkit-user-select: none;
}

#lockScreen {
  cursor: grab;
  touch-action: pan-y;
}

#lockScreen:active {
  cursor: grabbing;
}

input,
textarea {
  user-select: text;
  -webkit-user-select: text;
}


    
/* Cinematic iOS notification center */
.lock-notifications {
  position: absolute;
  top: 44%;
  left: 16px;
  right: 16px;
  color: white;
}

.notification-heading {
  margin: 0 0 10px 5px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.2px;
  color: rgba(255, 255, 255, 0.8);
}

.notification-card {
  display: flex;
  gap: 10px;
  padding: 13px;
  border-radius: 18px;
  background: rgba(35, 38, 45, 0.68);
  border: 1px solid rgba(255, 255, 255, 0.12);
  -webkit-backdrop-filter: blur(22px) saturate(140%);
  backdrop-filter: blur(22px) saturate(140%);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
}

.notification-app-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: #3978d4;
  font-size: 17px;
  font-weight: 600;
}

.notification-content {
  flex: 1;
  min-width: 0;
}

.notification-topline {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
}

.notification-topline span {
  color: rgba(255, 255, 255, 0.65);
}

.notification-title {
  margin-top: 5px;
  font-size: 13px;
  font-weight: 600;
}

.notification-preview {
  margin-top: 3px;
  font-size: 12px;
  line-height: 1.45;
  color: rgba(255, 255, 255, 0.9);
}


.lock-swipe-hint {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 50px;
  margin: 0;
  text-align: center;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.72);
  pointer-events: none;
}


    .home-notification {
  position: absolute;
  top: 55px;
  left: 12px;
  right: 12px;
  z-index: 50;
  animation: notificationDrop 0.35s ease-out;
}

.home-notification-card {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: 100%;
  padding: 13px;
  text-align: left;
  color: white;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 18px;
  background: rgba(45,45,50,0.88);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
  font: inherit;
  cursor: pointer;
}

.home-notification-card .notification-content {
  display: block;
  flex: 1;
  min-width: 0;
}

.home-notification-card .notification-topline {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
}

.home-notification-card .notification-title,
.home-notification-card .notification-preview {
  display: block;
  margin-top: 4px;
  font-size: 12px;
}

.home-notification-card .notification-preview {
  color: rgba(255,255,255,0.85);
}

@keyframes notificationDrop {
  from {
    opacity: 0;
    transform: translateY(-12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
  

}
html, body { overscroll-behavior: none; }

#lockScreen {
  touch-action: none;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
}

#lockScreen * {
  touch-action: none;
}

.swipe-hint {
  width: 150px;
  height: 32px;
  bottom: 0;
  background: transparent;
  pointer-events: auto;
  touch-action: none;
  cursor: pointer;
}

.swipe-hint::after {
  content: "";
  position: absolute;
  left: 22px;
  right: 22px;
  bottom: 8px;
  height: 4px;
  border-radius: 999px;
  background: #fff;
}

.phone:has(#appScreen.active) .swipe-hint::after {
  background: #222;
}
    
.notification-card,
.notification-heading {
  display: none !important;
}

    .app { position: relative; }

.app-badge {
  position: absolute;
  top: -6px;
  left: calc(50% + 8px);
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  border-radius: 11px;
  background: #ff3b30;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  line-height: 22px;
  text-align: center;
  z-index: 5;
  pointer-events: none;
}

.app-badge[hidden] { display: none; }


    html, body { height: 100%; overflow: hidden; }
body { padding: 0; }

.phone {
  position: fixed !important;
  top: 50%;
  left: 50%;
  width: 390px !important;
  height: 844px !important;
  max-height: none !important;
  aspect-ratio: auto;
  transform: translate(-50%, -50%) scale(var(--s, 1));
  transform-origin: center center;
}

.status-bar { height: 54px; padding: 17px 30px 0; font-size: 15px; font-weight: 600; align-items: center; }
.sb-bat { background: #fff; color: #000; border-radius: 6px; padding: 1px 6px; font-size: 11px; font-weight: 700; }
.phone:has(#appScreen.active) .status-bar { color: #111; }
.phone:has(#appScreen.active) .sb-bat { background: #111; color: #fff; }

    html, body { overscroll-behavior: none; }

  const list = $("waMessages");

  const waKeyboard = $("waVirtualKeyboard");
  const waKeyboardKeys = $("waKeyboardKeys");
  const waInput = $("waChatInput");

  let waShift = false;
  let waSymbols = false;

  function waInsertText(text) {
    if (waInput.disabled) return;

    const start = waInput.selectionStart ?? waInput.value.length;
    const end = waInput.selectionEnd ?? start;

    waInput.value =
      waInput.value.slice(0, start) +
      text +
      waInput.value.slice(end);

    const cursor = start + text.length;
    waInput.setSelectionRange(cursor, cursor);
    waInput.dispatchEvent(new Event("input", { bubbles: true }));
    waInput.focus();
  }

  function waRenderKeyboard() {
    const rows = waSymbols
      ? [
          ["1","2","3","4","5","6","7","8","9","0"],
          ["@","#","$","%","&","-","+","(",")","/"],
          ["*","\"",":",";","!","?","'"],
        ]
      : [
          ["q","w","e","r","t","y","u","i","o","p"],
          ["a","s","d","f","g","h","j","k","l"],
          ["SHIFT","z","x","c","v","b","n","m","BACK"],
        ];

    waKeyboardKeys.innerHTML = "";

    rows.forEach((row, rowIndex) => {
      const rowEl = document.createElement("div");
      rowEl.className = "wa-key-row";

      row.forEach(key => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "wa-key";

        if (["SHIFT", "BACK"].includes(key)) {
          button.classList.add("special");
        }

        button.textContent =
          key === "SHIFT" ? "⇧" :
          key === "BACK" ? "⌫" :
          (!waSymbols && waShift ? key.toUpperCase() : key);

        button.addEventListener("click", () => {
          if (key === "SHIFT") {
            waShift = !waShift;
            waRenderKeyboard();
          } else if (key === "BACK") {
            const start = waInput.selectionStart ?? waInput.value.length;
            const end = waInput.selectionEnd ?? start;

            if (start !== end) {
              waInput.setRangeText("", start, end, "start");
            } else if (start > 0) {
              waInput.setRangeText("", start - 1, start, "start");
            }

            waInput.dispatchEvent(new Event("input", { bubbles: true }));
            waInput.focus();
          } else {
            waInsertText(
              !waSymbols && waShift ? key.toUpperCase() : key
            );

            if (waShift) {
              waShift = false;
              waRenderKeyboard();
            }
          }
        });

        rowEl.appendChild(button);
      });

      waKeyboardKeys.appendChild(rowEl);
    });

    const bottom = document.createElement("div");
    bottom.className = "wa-key-row";

    const symbolButton = document.createElement("button");
    symbolButton.type = "button";
    symbolButton.className = "wa-key special";
    symbolButton.textContent = waSymbols ? "ABC" : "123";
    symbolButton.onclick = () => {
      waSymbols = !waSymbols;
      waRenderKeyboard();
    };

    const emojiButton = document.createElement("button");
    emojiButton.type = "button";
    emojiButton.className = "wa-key special";
    emojiButton.textContent = "☺";
    emojiButton.onclick = () => {
      const emoji = prompt("Masukkan emoji yang ingin dipakai:", "😊");
      if (emoji) waInsertText(emoji);
    };

    const spaceButton = document.createElement("button");
    spaceButton.type = "button";
    spaceButton.className = "wa-key space";
    spaceButton.textContent = "spasi";
    spaceButton.onclick = () => waInsertText(" ");

    const enterButton = document.createElement("button");
    enterButton.type = "button";
    enterButton.className = "wa-key special";
    enterButton.textContent = "Kirim";
    enterButton.onclick = () => $("waChatForm").requestSubmit();

    bottom.append(symbolButton, emojiButton, spaceButton, enterButton);
    waKeyboardKeys.appendChild(bottom);
  }

  waRenderKeyboard();

   waInput.setAttribute("inputmode", "none");

  messages.forEach(message => addWhatsAppBubble(list, message));

  function waShowKeyboard() {
    waKeyboard.classList.add("visible");
    requestAnimationFrame(() => {
      list.scrollTop = list.scrollHeight;
    });
  }

  function waHideKeyboard() {
    waKeyboard.classList.remove("visible");
    waInput.blur();
  }

  waInput.addEventListener("focus", waShowKeyboard);
  list.addEventListener("click", waHideKeyboard);
  $("waKeyboardClose").addEventListener("click", waHideKeyboard);

  $("waChatForm").addEventListener("submit", async event => {
    event.preventDefault();

    const input = $("waChatInput");
    const value = input.value.trim();
    if (!value) return;

    const message = { text: value, time: Date.now(), from: "Raka" };

    waChats[contact] ||= [];

    const history = waChats[contact]
      .slice(-12)
      .map(item => ({
        role: item.from === "Raka" ? "user" : "model",
        text: item.text
      }));

    waChats[contact].push(message);
    waSaveChats();
    addWhatsAppBubble(list, message);
    input.value = "";

    const sendButton = $("waChatForm").querySelector("button");
    const typing = $("waTyping");

    sendButton.disabled = true;
    input.disabled = true;

    window.waActiveContacts ||= new Set();
    window.waTypingContacts ||= new Set();
    window.waActiveContacts.add(contact);
    window.waTypingContacts.add(contact);

    typing.style.display = "block";
    waUpdatePresenceLabel(contact);
    list.scrollTop = list.scrollHeight;

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ character: contact, message: value, history })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || `Request gagal (${response.status})`);
      }

      const replies = Array.isArray(data.messages)
        ? data.messages
        : (typeof data.reply === "string" && data.reply.trim() ? [data.reply] : []);

      if (!replies.length) throw new Error("Balasan AI kosong.");

      typing.style.display = "none";
      window.waTypingContacts.delete(contact);
      waUpdatePresenceLabel(contact);

      for (let i = 0; i < replies.length; i++) {
        const text = replies[i];
        if (typeof text !== "string" || !text.trim()) continue;

        if (i > 0) await waDelay(500 + Math.min(text.length * 12, 650));

        const reply = { text: text.trim(), time: Date.now(), from: contact };
        waChats[contact].push(reply);
        waSaveChats();
        addWhatsAppBubble(list, reply);
      }
    } catch (error) {
      console.error("Gagal mendapat balasan AI:", error);
      if (typeof showToast === "function") {
        showToast("Balasan AI gagal dimuat. Coba lagi.");
      }
    } finally {
      typing.style.display = "none";

      list.scrollTop = list.scrollHeight;
    }
  });

  showScreen("appScreen");
  list.scrollTop = list.scrollHeight;
}

    
function addWhatsAppBubble(container, message) {
  const bubble = document.createElement("div");

  bubble.className =
    `wa-message-bubble ${mine ? "mine" : "theirs"}`;

  const text = document.createElement("div");
  text.textContent = message.text;

  const meta = document.createElement("div");
  meta.className = "wa-message-meta";

  const time = document.createElement("span");
  time.textContent = waTime(message.time);
  meta.appendChild(time);

  if (mine) {
    const check = document.createElement("span");
    check.className = "wa-message-check";
    check.textContent = "✓✓";
    meta.appendChild(check);
  }

  bubble.append(text, meta);
  container.appendChild(bubble);
  container.scrollTop = container.scrollHeight;
}

${post.image

  : `<div style="aspect-ratio:1/1;border-radius:5px;background:${post.color};display:grid;place-items:center;color:#ffffffb0;font-size:12px;letter-spacing:3px">R A K A</div>`
}


      <div style="display:flex;align-items:center;gap:15px;padding:10px 0 7px">
        <button onclick="toggleInstagramLike('${post.id}')" style="background:none;color:${post.liked ? "#ed4956" : "#222"};font-size:24px" aria-label="Like post">${post.liked ? "♥" : "♡"}</button>

function escapeIG(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function toggleInstagramLike(id) {
  const post = igPosts.find(item => item.id === id);
  if (!post) return;

  post.liked = !post.liked;
  post.likes = Math.max(0, post.likes + (post.liked ? 1 : -1));
  saveInstagram();
  renderInstagramFeed();
}

function addInstagramComment(event, id) {
  event.preventDefault();

  const input = $("ig-comment-" + id);
  const value = input.value.trim();
  if (!value) return;

  const post = igPosts.find(item => item.id === id);
  if (!post) return;

  post.comments.push({ user: "raka.jpg", text: value });
  saveInstagram();
  renderInstagramFeed();
}

function focusInstagramComment(id) {
  const input = $("ig-comment-" + id);
  if (input) input.focus();
}

function publishInstagramPost() {
  const input = $("igNewCaption");
  const caption = input.value.trim();
  if (!caption) {
    showToast("Write a caption first");
    return;
  }

  igPosts.unshift({
    id: "ig" + Date.now(),
    user: "raka.jpg",
    location: "Malang, Indonesia",
    caption,
    likes: 0,
    liked: false,
    comments: [],
    color: "linear-gradient(145deg,#64748b,#a8a0b9,#30394b)"
  });

  saveInstagram();
  renderInstagramFeed();
  input.value = "";
  showToast("Post shared");
}

const lock = $("lockScreen");

let startY = 0;
let lastY = 0;
let trackingSwipe = false;

lock.addEventListener("pointerdown", e => {
  if (e.target.closest("button, input, textarea, select, a")) return;

  startY = e.clientY;
  lastY = e.clientY;
  trackingSwipe = true;

  lock.setPointerCapture(e.pointerId);
});

lock.addEventListener("pointermove", e => {
  if (!trackingSwipe) return;

  lastY = e.clientY;

  const distance = startY - lastY;

  if (distance > 0) {
    lock.style.setProperty(
      "--swipe-offset",
      `${-distance * 0.65}px`
    );
  }
});

function finishLockSwipe(e) {
  if (!trackingSwipe) return;

  const distance = startY - lastY;
  trackingSwipe = false;

  lock.style.removeProperty("--swipe-offset");

  if (distance > 40) {
    unlock();
  }
}

lock.addEventListener("pointerup", finishLockSwipe);

lock.addEventListener("pointercancel", () => {
  trackingSwipe = false;
  lock.style.removeProperty("--swipe-offset");
});
